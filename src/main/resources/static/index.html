<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockLogic Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .low-stock { background-color: #fff1f1; border-left: 5px solid #dc3545; }
        .card { margin-bottom: 2rem; }
    </style>
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>📦 StockLogic Inventory</h1>
        <button class="btn btn-outline-secondary btn-sm" onclick="refreshAll()">🔄 Refresh All</button>
    </div>

    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">Current Inventory Status</h5>
        </div>
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th>SKU</th>
                    <th>Product Name</th>
                    <th>Category</th>
                    <th>Quantity</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody id="product-table-body"></tbody>
            </table>
        </div>
    </div>

    <div class="card shadow">
        <div class="card-header bg-dark text-white text-center">
            <h5 class="mb-0">Recent Activity Log</h5>
        </div>
        <div class="card-body p-0">
            <table class="table table-sm table-striped mb-0 text-center">
                <thead>
                <tr>
                    <th>Date</th>
                    <th>Product</th>
                    <th>Type</th>
                    <th>Amount</th>
                    <th>Reason</th>
                </tr>
                </thead>
                <tbody id="transaction-table-body"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    async function refreshAll() {
        await loadProducts();
        await loadTransactions();
    }

    async function loadProducts() {
        const response = await fetch('/api/products');
        const products = await response.json();
        const tableBody = document.getElementById('product-table-body');

        tableBody.innerHTML = products.map(p => `
            <tr class="${p.quantity < p.minStockLevel ? 'low-stock' : ''}">
                <td class="align-middle"><code>${p.sku}</code></td>
                <td class="align-middle"><strong>${p.name}</strong></td>
                <td class="align-middle">${p.category.name}</td>
                <td class="align-middle">${p.quantity}</td>
                <td class="align-middle">
                    ${p.quantity < p.minStockLevel ? '<span class="badge bg-danger">Low Stock</span>' : '<span class="badge bg-success">Healthy</span>'}
                </td>
                <td class="align-middle">
                    <button class="btn btn-sm btn-success me-1" onclick="handleUpdate(${p.id}, 'RESTOCK')">Restock</button>
                    <button class="btn btn-sm btn-danger" onclick="handleUpdate(${p.id}, 'SALE')">Sell</button>
                </td>
            </tr>
        `).join('');
    }

    async function loadTransactions() {
        const response = await fetch('/api/products/transactions');
        const transactions = await response.json();
        const tableBody = document.getElementById('transaction-table-body');

        // Show last 10 transactions, newest first
        tableBody.innerHTML = transactions.slice(-10).reverse().map(t => `
            <tr>
                <td>${new Date(t.createdAt).toLocaleString()}</td>
                <td>${t.product.name}</td>
                <td><span class="badge ${t.transactionType === 'SALE' ? 'bg-warning text-dark' : 'bg-info'}">${t.transactionType}</span></td>
                <td>${t.changeAmount > 0 ? '+' : ''}${t.changeAmount}</td>
                <td class="text-muted small">${t.reason}</td>
            </tr>
        `).join('');
    }

    async function handleUpdate(productId, type) {
        const amountStr = prompt(`Enter quantity to ${type === 'RESTOCK' ? 'add' : 'remove'}:`, "1");
        if (!amountStr || isNaN(amountStr)) return;

        let amount = parseInt(amountStr);
        if (type === 'SALE') amount = -Math.abs(amount); // Ensure it's negative for sales

        const reason = prompt("Enter reason:", type === 'RESTOCK' ? "New Shipment" : "Customer Purchase");
        if (!reason) return;

        const url = `/api/products/${productId}/stock?amount=${amount}&type=${type}&reason=${encodeURIComponent(reason)}`;

        const response = await fetch(url, { method: 'POST' });
        if (response.ok) {
            refreshAll();
        } else {
            alert("Action failed. Check stock levels.");
        }
    }

    refreshAll();
</script>
</body>
</html>
