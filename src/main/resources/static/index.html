<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockLogic Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .low-stock { background-color: #fff1f1; border-left: 5px solid #dc3545; }
        .card { margin-bottom: 2rem; }
    </style>
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>📦 StockLogic Inventory</h1>
        <button class="btn btn-outline-secondary btn-sm" onclick="refreshAll()">🔄 Refresh All</button>
    </div>

        <div class="mb-3 text-end">
            <a href="/api/products/export" class="btn btn-outline-success me-2">📊 Export to CSV</a>
            <button class="btn btn-outline-info me-2" onclick="addNewCategory()">+ New Category</button>
            <button class="btn btn-outline-danger me-2" onclick="removeCategory()">- Delete Category</button>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addProductModal">+ Add New Product</button>
        </div>
    <div class="card shadow">
        <div class="card-header bg-primary text-white text-center">
            <h5 class="mb-0">Dashboard Stats</h5>
        </div>
        <div class="row mb-4">
            <div class="col-md-4">
                <div class="card bg-white shadow-sm border-0">
                    <div class="card-body text-center">
                        <h6 class="text-muted">Total Products</h6>
                        <h2 id="stat-total-items">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card bg-white shadow-sm border-0">
                    <div class="card-body text-center">
                        <h6 class="text-muted">Low Stock Alerts</h6>
                        <h2 id="stat-low-stock" class="text-danger">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card bg-white shadow-sm border-0">
                    <div class="card-body text-center">
                        <h6 class="text-muted">Total Inventory Value</h6>
                        <h2 id="stat-total-value">$0.00</h2>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="card shadow">
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0">🔍</span>
                    <input type="text" id="searchInput" class="form-control form-control-lg border-start-0"
                           placeholder="Search by product name, SKU, or category..."
                           onkeyup="filterProducts()">
                </div>
            </div>
        </div>
        <div class="card-header bg-primary text-white text-center">
            <h5 class="mb-0">Current Inventory Status</h5>
        </div>
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th>SKU</th>
                    <th>Product Name</th>
                    <th>Category</th>
                    <th>Quantity</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody id="product-table-body"></tbody>
            </table>
        </div>
    </div>

    <div class="card shadow">
        <div class="card-header bg-dark text-white text-center">
            <h5 class="mb-0">Recent Activity Log</h5>
        </div>
        <div class="card-body p-0">
            <table class="table table-sm table-striped mb-0 text-center">
                <thead>
                <tr>
                    <th>Date</th>
                    <th>Product</th>
                    <th>Type</th>
                    <th>Amount</th>
                    <th>Reason</th>
                </tr>
                </thead>
                <tbody id="transaction-table-body"></tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal fade" id="addProductModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add New Product</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="productForm">
                    <div class="mb-3"><label class="form-label">Name</label><input type="text" id="newName" class="form-control" required></div>
                    <div class="mb-3"><label class="form-label">SKU</label><input type="text" id="newSku" class="form-control" required></div>
                    <div class="mb-3"><label class="form-label">Price</label><input type="number" step="0.01" id="newPrice" class="form-control" required></div>
                    <div class="mb-3"><label class="form-label">Min Stock Level</label><input type="number" id="newMinStock" class="form-control" value="5"></div>
                    <div class="mb-3">
                        <label class="form-label">Category ID</label>
                        <select id="newCategory" class="form-select">
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="saveNewProduct()">Save Product</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    let allProducts = []; // This will hold our "master list" of products

    async function refreshAll() {
        // Clear the search bar so the user sees ALL data again
        document.getElementById('searchInput').value = '';

        // Pull the fresh data
        await loadProducts();
        await loadTransactions();
        await loadStats();
        await loadCategories();

        console.log("Dashboard synced with database.");
    }

    async function loadStats() {
        const response = await fetch('/api/products/stats');
        const stats = await response.json();

        document.getElementById('stat-total-items').innerText = stats.totalItems;
        document.getElementById('stat-low-stock').innerText = stats.lowStockCount;
        document.getElementById('stat-total-value').innerText =
            new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(stats.totalValue);
    }

    async function loadProducts() {
        try {
            const response = await fetch('/api/products');
            allProducts = await response.json();
            displayProducts(allProducts); // Show everything initially
        } catch (error) {
            console.error("Error loading products:", error);
        }
    }

    // Helper function to render the table rows
    function displayProducts(products) {
        const tableBody = document.getElementById('product-table-body');

        if (products.length === 0) {
            tableBody.innerHTML = `<tr><td colspan="6" class="text-center text-muted">No products found matching your search.</td></tr>`;
            return;
        }

        tableBody.innerHTML = products.map(p => {
            const isLow = p.quantity < p.minStockLevel;
            return `
            <tr class="${isLow ? 'low-stock' : ''}">
                <td class="align-middle"><code>${p.sku}</code></td>
                <td class="align-middle"><strong>${p.name}</strong></td>
                <td class="align-middle">${p.category.name}</td>
                <td class="align-middle">${p.quantity}</td>
                <td class="align-middle">
                    ${isLow ? '<span class="badge bg-danger">Low Stock</span>' : '<span class="badge bg-success">Healthy</span>'}
                </td>
                <td class="align-middle">
                    <button class="btn btn-sm btn-success" onclick="handleUpdate(${p.id}, 'RESTOCK')">Restock</button>
                    <button class="btn btn-sm btn-danger" onclick="handleUpdate(${p.id}, 'SALE')">Sell</button>
                    <button class="btn btn-sm btn-outline-secondary ms-1" onclick="deleteProduct(${p.id})">🗑️</button>
                </td>
            </tr>
        `;
        }).join('');
    }

    // The search logic
    function filterProducts() {
        const term = document.getElementById('searchInput').value.toLowerCase();

        const filtered = allProducts.filter(p =>
            p.name.toLowerCase().includes(term) ||
            p.sku.toLowerCase().includes(term) ||
            p.category.name.toLowerCase().includes(term)
        );

        displayProducts(filtered);
    }

    async function loadTransactions() {
        const response = await fetch('/api/products/transactions');
        const transactions = await response.json();
        const tableBody = document.getElementById('transaction-table-body');

        // Show last 10 transactions, newest first
        tableBody.innerHTML = transactions.slice(-10).reverse().map(t => `
            <tr>
                <td>${new Date(t.createdAt).toLocaleString()}</td>
                <td>${t.product.name}</td>
                <td><span class="badge ${t.transactionType === 'SALE' ? 'bg-warning text-dark' : 'bg-info'}">${t.transactionType}</span></td>
                <td>${t.changeAmount > 0 ? '+' : ''}${t.changeAmount}</td>
                <td class="text-muted small">${t.reason}</td>
            </tr>
        `).join('');
    }

    async function loadCategories() {
        const response = await fetch('/api/categories');
        const categories = await response.json();
        const select = document.getElementById('newCategory');

        select.innerHTML = categories.map(c => `
        <option value="${c.id}">${c.name} (ID: ${c.id})</option>
    `).join('');
    }

    async function handleUpdate(productId, type) {
        const amountStr = prompt(`Enter quantity to ${type === 'RESTOCK' ? 'add' : 'remove'}:`, "1");
        if (!amountStr || isNaN(amountStr)) return;

        let amount = parseInt(amountStr);
        if (type === 'SALE') amount = -Math.abs(amount); // Ensure it's negative for sales

        const reason = prompt("Enter reason:", type === 'RESTOCK' ? "New Shipment" : "Customer Purchase");
        if (!reason) return;

        const url = `/api/products/${productId}/stock?amount=${amount}&type=${type}&reason=${encodeURIComponent(reason)}`;

        const response = await fetch(url, { method: 'POST' });
        if (response.ok) {
            refreshAll();
        } else {
            alert("Action failed. Check stock levels.");
        }
    }

    async function saveNewProduct() {
        const productData = {
            name: document.getElementById('newName').value,
            sku: document.getElementById('newSku').value,
            price: parseFloat(document.getElementById('newPrice').value),
            quantity: 0,
            minStockLevel: parseInt(document.getElementById('newMinStock').value),
            category: { id: parseInt(document.getElementById('newCategory').value) }
        };

        const response = await fetch('/api/products', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(productData)
        });

        if (response.ok) {
            // Close modal and refresh
            bootstrap.Modal.getInstance(document.getElementById('addProductModal')).hide();
            document.getElementById('productForm').reset();
            refreshAll();
        } else {
            alert("Error saving product.");
        }
    }

    async function deleteProduct(id) {
        if (confirm("Are you sure you want to delete this product? All transaction history for it will be lost.")) {
            const response = await fetch(`/api/products/${id}`, { method: 'DELETE' });
            if (response.ok) refreshAll();
        }
    }

    async function addNewCategory() {
        const name = prompt("Enter new category name (e.g., Furniture):");
        if (!name) return;

        const description = prompt("Enter a brief description for this category:");
        if (!description) return; // Or set a default like "No description provided"

        const response = await fetch('/api/categories', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                name: name,
                description: description
            })
        });

        if (response.ok) {
            alert("Category added successfully!");
            refreshAll(); // This will refresh your dropdown automatically
        } else {
            alert("Error adding category.");
        }
    }

    async function removeCategory() {
        const id = prompt("Enter the Category ID to delete:");
        if (!id) return;

        try {
            const response = await fetch(`/api/categories/${id}`, { method: 'DELETE' });

            if (response.ok) {
                alert("Category deleted successfully!");
                refreshAll();
            } else {
                // We try to read the JSON, but catch it if it's not JSON
                const errorData = await response.json().catch(() => ({}));

                if (response.status === 404) {
                    alert(`🔍 Not Found: The ID ${id} doesn't exist.`);
                } else if (response.status === 400) {
                    alert(`⚠️ Error: ${errorData.message || "This category is still in use by products."}`);
                } else {
                    alert("Unexpected Error: " + (errorData.message || "Something went wrong."));
                }
            }
        } catch (err) {
            alert("Connection error: Could not reach the server.");
        }
    }

    refreshAll();
</script>
</body>
</html>
